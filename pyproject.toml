[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-data-doris-demo"
version = "0.1.0"
description = "A small crypto market-data pipeline backed by Apache Doris"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "pymysql>=1.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "uvicorn>=0.27",
    "websockets>=12,<14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
market-data = "market_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
