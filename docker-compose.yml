# 单容器 Doris：1 个 FE + 1 个 BE，仅用于本 demo。
# 镜像约 2.7 GB，容器健康大约需要几十秒。建议 Docker Desktop 至少预留 6 GB 内存。
# 生产集群不要用这个镜像，副本数和资源限制都是按 CI 缩小过的。
services:
  doris:
    image: ${DORIS_IMAGE:-apache/doris:all-in-one-4.1.3}
    container_name: market-data-doris
    ports:
      - "8030:8030" # FE HTTP，Stream Load 入口，以及 /api/health
      - "8040:8040" # BE HTTP，Stream Load 重定向目标
      - "9030:9030" # MySQL 协议，建表和查询
    restart: unless-stopped
